name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build JAR
        run: mvn -B package

      - name: JAR als Download bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: NeptunPets
          path: target/NeptunPets-*.jar

      # Bei einem Tag wie v1.0.0 wird die JAR zusätzlich als GitHub-Release veröffentlicht
      - name: Release erstellen
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: target/NeptunPets-*.jar
